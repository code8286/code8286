[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gravbox"
version = "1.0.0"
description = "GravBox: an interactive N-body gravity simulator with persistent trails, energy diagnostics, CSV export and an OpenGL 3D view."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "alpha" }]
keywords = ["n-body", "gravity", "physics", "simulation", "orbital-mechanics", "pygame", "opengl"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "pygame>=2.1",
    "numpy>=1.22",
    "PyOpenGL>=3.1.6",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
build = ["pyinstaller>=6"]

[project.scripts]
gravbox = "gravbox.app:main"

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/gravbox"
Issues = "https://github.com/YOUR_USERNAME/gravbox/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045", "B008"]
